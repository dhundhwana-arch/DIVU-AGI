[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The URL is normally supplied by the environment (DIVU_DATABASE_URL) so that the same
# revision set is used for SQLite (dev/CI) and PostgreSQL (production).
sqlalchemy.url = sqlite+aiosqlite:///./.data/divu.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
